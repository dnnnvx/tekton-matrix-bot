[package]
name = "tekton-matrix-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Homelab Matrix bot answering !commands, end-to-end encryption capable"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", default-features = false, features = ["aws-lc-rs", "client", "runtime", "rustls-tls"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
matrix-sdk = { version = "0.19.1", features = ["e2e-encryption", "markdown", "sqlite"] }
matrix-sdk-store-encryption = "0.19.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
strip = true
panic = "abort"
